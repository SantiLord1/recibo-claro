<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recibo Claro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Liquidación de sueldos y recibos para empresas uruguayas: sueldo mensual, aguinaldo, licencia, salario vacacional y egresos, con ayuda de IA.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500&display=swap">
<style>
/* Layout: office tool. Fixed sidebar of the payroll steps (panel → empleados → novedades → liquidación → recibos),
   working area with one task per view. Numbers in a mono face with tabular figures; recibos look like the paper document. */
:root{
  --bg:#F2F4F6; --surface:#FFFFFF; --sunk:#E9EDF1; --ink:#17212B; --muted:#5B6874; --line:#D8DEE5;
  --accent:#2343A6; --accent-ink:#FFFFFF; --accent-soft:#E7ECFA;
  --money:#1F6B45; --money-soft:#E3F2EA; --warn:#9A5D00; --warn-soft:#FBF0DC; --bad:#B0261D; --bad-soft:#FBE5E3;
  --paper:#FFFFFF; --paper-ink:#1B1B1B; --paper-line:#BFC6CC;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --serif:"IBM Plex Serif",Georgia,"Times New Roman",serif;
  --r:10px; --shadow:0 1px 2px rgba(20,30,45,.06),0 4px 14px rgba(20,30,45,.05);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161C; --surface:#18202A; --sunk:#1F2934; --ink:#E6EBF0; --muted:#98A5B2; --line:#2C3845;
  --accent:#8FA8F2; --accent-ink:#0F1726; --accent-soft:#22305A;
  --money:#6CCB98; --money-soft:#173628; --warn:#F0B451; --warn-soft:#3A2C12; --bad:#F2867D; --bad-soft:#3E1D1A;
  --paper:#FFFFFF; --paper-ink:#1B1B1B; --paper-line:#BFC6CC; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161C; --surface:#18202A; --sunk:#1F2934; --ink:#E6EBF0; --muted:#98A5B2; --line:#2C3845;
  --accent:#8FA8F2; --accent-ink:#0F1726; --accent-soft:#22305A;
  --money:#6CCB98; --money-soft:#173628; --warn:#F0B451; --warn-soft:#3A2C12; --bad:#F2867D; --bad-soft:#3E1D1A;
  --paper:#FFFFFF; --paper-ink:#1B1B1B; --paper-line:#BFC6CC; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;line-height:1.25;text-wrap:balance}

.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:1.05rem}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--serif);font-size:1.05rem}
.company{font-size:.82rem;color:var(--muted);line-height:1.35}
.company b{display:block;color:var(--ink);font-weight:500}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:.93rem}
.nav a:hover{background:var(--sunk)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:500}
.nav .step{font-family:var(--mono);font-size:.72rem;color:var(--muted);width:16px}
.nav a[aria-current="page"] .step{color:var(--accent)}
.nav-sep{height:1px;background:var(--line);margin:8px 2px}
.ai-state{margin-top:auto;font-size:.78rem;color:var(--muted);display:flex;gap:6px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.on{background:var(--money)} .dot.off{background:var(--warn)}

.main{min-width:0;padding-block:22px 48px;padding-left:max(16px,2.2vw);padding-right:max(16px,env(safe-area-inset-right,0px),2.2vw)}
.topbar{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;margin-bottom:18px}
.topbar h1{font-size:1.45rem;font-weight:600}
.topbar .sub{color:var(--muted);font-size:.9rem;margin-top:2px}
.period{display:flex;align-items:center;gap:8px;font-size:.88rem;color:var(--muted)}
.period input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.78rem;font-weight:500;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--money-soft);color:var(--money)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.acc{background:var(--accent-soft);color:var(--accent)}

.stack{display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.card-h h2{font-size:1rem;font-weight:600}
.card-h p{margin:2px 0 0;color:var(--muted);font-size:.85rem}
.card-b{padding:16px 18px}
.grid-kpi{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi span{display:block;font-size:.78rem;color:var(--muted)}
.kpi b{display:block;font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:500;font-size:1.3rem;margin-top:4px;white-space:nowrap}
.kpi em{display:block;font-style:normal;font-size:.78rem;color:var(--muted);margin-top:2px}
.kpi.main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.kpi.main span,.kpi.main em{color:var(--accent-ink);opacity:.85}
.two{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;cursor:pointer;font-size:.9rem;font-weight:500;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.ai{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.btn.danger{color:var(--bad)} .btn.danger:hover{border-color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.sm{padding:4px 10px;font-size:.82rem}
.btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.linkbtn{border:0;background:none;color:var(--accent);cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px;font-size:inherit}

.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem;color:inherit}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
td.num{white-space:nowrap}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--sunk)}
tfoot td{font-weight:600;border-top:2px solid var(--line);border-bottom:0}
.who b{display:block;font-weight:500}
.who span{font-size:.8rem;color:var(--muted)}
.neg{color:var(--bad)}
.liq{color:var(--money);font-weight:500}

.nov input{width:74px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:5px 6px;text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.85rem}
.nov input:focus{border-color:var(--accent)}
.nov input.changed{background:var(--accent-soft);border-color:var(--accent)}
.nov th{white-space:normal;line-height:1.25;min-width:74px;vertical-align:bottom}
.nov td.na{color:var(--muted);text-align:center}
.nov td.who{min-width:150px}

.form{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 16px}
.form .f{display:flex;flex-direction:column;gap:4px;min-width:0}
.form .f.w2{grid-column:span 2} .form .f.w3{grid-column:1/-1}
.form label{font-size:.8rem;color:var(--muted);font-weight:500}
.form input,.form select,.form textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;width:100%}
.form small{font-size:.75rem;color:var(--muted)}
.check{display:flex;gap:8px;align-items:center;font-size:.9rem}
.check input{width:auto}
textarea{resize:vertical}

.ai-box{border:1px solid var(--accent);background:var(--accent-soft);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.ai-box h3{font-size:.95rem;font-weight:600;color:var(--accent)}
.ai-box textarea{width:100%;min-height:76px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface)}
.ai-box p{margin:0;font-size:.86rem}
.obs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.obs li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;padding:10px 12px;border-radius:8px;background:var(--sunk);font-size:.88rem}
.obs li .pill{align-self:start}
.obs li small{grid-column:2;color:var(--muted)}
.note{font-size:.85rem;color:var(--muted);margin:0}
.msg{font-size:.85rem;padding:8px 12px;border-radius:8px;background:var(--sunk)}
.msg.ok{background:var(--money-soft);color:var(--money)} .msg.err{background:var(--bad-soft);color:var(--bad)}
.confirm{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 12px;border-radius:8px;background:var(--warn-soft);color:var(--ink);font-size:.88rem}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:1rem;margin-bottom:4px}

.bars{display:flex;flex-direction:column;gap:10px}
.bar-row{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:.84rem}
.bar-row .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{display:flex;height:12px;border-radius:4px;overflow:hidden;background:var(--sunk)}
.bar i{display:block;height:100%}
.bar i.l{background:var(--money)} .bar i.d{background:var(--warn)} .bar i.p{background:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.78rem;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--c)}

/* recibo: papel, igual en ambos temas */
.recibo{background:var(--paper);color:var(--paper-ink);border:1px solid var(--paper-line);border-radius:4px;padding:26px 28px;max-width:760px;font-size:.86rem;box-shadow:var(--shadow)}
.recibo h2{font-family:var(--serif);font-weight:500;font-size:1.25rem;letter-spacing:.01em}
.rc-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;border-bottom:2px solid var(--paper-ink);padding-bottom:10px;margin-bottom:12px}
.rc-head .r{text-align:right}
.rc-meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 18px;margin-bottom:14px}
.rc-meta div span{display:block;font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:#5A6168}
.rc-tbl{width:100%;border-collapse:collapse;font-size:.84rem}
.rc-tbl th{color:#5A6168;border-bottom:1px solid var(--paper-ink);padding:6px 6px}
.rc-tbl td{border-bottom:1px dotted var(--paper-line);padding:6px 6px;vertical-align:top}
.rc-tbl td small{display:block;color:#5A6168;font-size:.74rem}
.rc-tbl tfoot td{border-top:1px solid var(--paper-ink);border-bottom:0;font-weight:600}
.rc-liq{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;padding:10px 12px;border:1px solid var(--paper-ink)}
.rc-liq b{font-family:var(--mono);font-size:1.15rem}
.rc-foot{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;margin-top:22px;font-size:.78rem;color:#3D444A}
.rc-sign{border-top:1px solid var(--paper-ink);padding-top:4px;text-align:center;margin-top:34px}
.rc-pat{margin-top:12px;font-size:.74rem;color:#5A6168}
.rc-notas{margin:10px 0 0;padding:8px 12px 8px 26px;border:1px dashed #9AA3AC;font-size:.74rem;color:#3B434B;display:grid;gap:3px}
.rc-meta .w2{grid-column:span 2}
.tabs{display:flex;gap:4px;flex-wrap:wrap;padding:10px 16px 0;border-bottom:1px solid var(--line)}
.tabs button{font:inherit;font-size:.86rem;padding:8px 12px;border:1px solid transparent;border-bottom:0;border-radius:8px 8px 0 0;background:none;color:var(--muted);cursor:pointer;margin-bottom:-1px}
.tabs button[aria-selected="true"]{background:var(--surface);border-color:var(--line);color:var(--ink);font-weight:600}
.form .sec{grid-column:1/-1;font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;padding-top:8px;border-top:1px solid var(--line);margin-top:4px}
.form .sec:first-child{border-top:0;padding-top:0;margin-top:0}
.mail{display:grid;gap:8px}
.mail .row{display:grid;grid-template-columns:70px minmax(0,1fr);gap:8px;align-items:baseline;font-size:.88rem}
.mail .row span{color:var(--muted);font-size:.78rem}
.lau td input{width:100%;min-width:90px}
.lau td.x{width:1%}
.paises{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.pais{font:inherit;text-align:left;display:flex;flex-direction:column;gap:2px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);cursor:pointer}
.pais:hover{border-color:var(--accent)}
.pais b{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.pais span{font-weight:600}
.pais small{font-size:.75rem;color:var(--muted)}
.pais[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.pais[aria-checked="true"] b,.pais[aria-checked="true"] small{color:var(--accent)}
.reglas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 24px}
.reglas section h3{font-size:.9rem;margin-bottom:6px}
.reglas ul{margin:0;padding-left:18px;display:grid;gap:5px;font-size:.88rem}
.cmp th[scope=row]{font-weight:600;min-width:120px;max-width:150px;white-space:normal}
.cmp td{font-size:.84rem;min-width:130px;vertical-align:top}
.cmp .sel{background:var(--accent-soft)}
@media (max-width:860px){.paises{grid-template-columns:repeat(3,minmax(0,1fr))}.reglas{grid-template-columns:minmax(0,1fr)}}
@media (max-width:520px){.paises{grid-template-columns:repeat(2,minmax(0,1fr))}}

.split{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:18px;align-items:start}
.list{display:flex;flex-direction:column}
.list button{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 14px;cursor:pointer}
.list button:hover{background:var(--sunk)}
.list button[aria-current="true"]{background:var(--accent-soft)}
.list button:last-child{border-bottom:0}
.list .t{font-weight:500;font-size:.9rem}
.list .s{font-size:.78rem;color:var(--muted)}
.explain{display:flex;flex-direction:column;gap:8px;font-size:.9rem}
.explain ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.explain .quote{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;white-space:pre-wrap}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.88rem;box-shadow:var(--shadow);z-index:20}
.loading{display:inline-flex;align-items:center;gap:8px;color:var(--accent);font-size:.88rem}
.loading::before{content:"";width:12px;height:12px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.loading::before{animation:none}}

@media (max-width:980px){
  .grid-kpi{grid-template-columns:repeat(2,minmax(0,1fr))}
  .two,.split{grid-template-columns:minmax(0,1fr)}
  .form{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding-right:max(16px,env(safe-area-inset-right,0px));gap:12px}
  .nav{flex-direction:row;flex-wrap:wrap;gap:4px}
  .nav a{padding:6px 10px;font-size:.85rem;background:var(--sunk)}
  .nav-sep,.ai-state,.company,.nav .step:empty{display:none}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px))}
  .form{grid-template-columns:minmax(0,1fr)} .form .f.w2{grid-column:auto}
  .rc-meta{grid-template-columns:repeat(2,minmax(0,1fr))}
  .recibo{padding:18px 16px}
  .bar-row{grid-template-columns:minmax(0,90px) minmax(0,1fr) auto}
}
@media print{
  .side,.topbar,.no-print,.toast{display:none!important}
  .app{display:block} .main{padding:0} body{background:#fff}
  .recibo{box-shadow:none;border:0;max-width:none}
}
</style>

</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><span class="brand-mark" aria-hidden="true">R</span>Recibo Claro</div>
    <div class="company" id="company"></div>
    <nav class="nav" id="nav" aria-label="Secciones">
      <a href="#panel" data-v="panel"><span class="step"></span>Panel</a>
      <a href="#empleados" data-v="empleados"><span class="step">1</span>Empleados</a>
      <a href="#novedades" data-v="novedades"><span class="step">2</span>Novedades del mes</a>
      <a href="#liquidacion" data-v="liquidacion"><span class="step">3</span>Liquidación</a>
      <a href="#recibos" data-v="recibos"><span class="step">4</span>Recibos</a>
      <span class="nav-sep" aria-hidden="true"></span>
      <a href="#aguinaldo" data-v="aguinaldo"><span class="step"></span>Aguinaldo</a>
      <a href="#egresos" data-v="egresos"><span class="step"></span>Egresos</a>
      <a href="#locacion" data-v="locacion"><span class="step"></span>Locación</a>
      <a href="#parametros" data-v="parametros"><span class="step"></span>Empresa y parámetros</a>
    </nav>
    <div class="ai-state"><span class="dot" id="aiDot"></span><span id="aiTxt">Conectando la IA…</span></div>
  </aside>
  <main class="main" id="main">
    <div class="empty"><b>Cargando Recibo Claro…</b>Preparando empleados, novedades y recibos.</div>
  </main>
</div>
<div class="toast" id="toast" hidden></div>
<script>
// ---------- Motor de liquidación (Uruguay, valores 2026) ----------
// Funciones puras: reciben empleado, novedades del mes y parámetros, y devuelven las líneas del recibo.
// Fuentes de los valores: BPS Comunicado R 5/2026 (BPC, escala IRPF, deducciones), BPS tasas FONASA,
// MTSS (salario mínimo 1/7/2026). Todo se puede editar en "Empresa y parámetros".
var PARAM_DEFAULT = {
  vigencia: "2026",
  bpc: 6864,
  smn: 25383,
  topeJub: 288836,
  jubPers: 15, frlPers: 0.1,
  jubPat: 7.5, fonasaPat: 5, frlPat: 0.1, fgcl: 0.025, bse: 1.5,
  // FONASA personal: [hasta 2,5 BPC] y [más de 2,5 BPC] por situación familiar

// Impuesto por franjas sobre una base mensual; devuelve {imp, marginal}

    Object.keys(emps).forEach(function (k) { ops.push(store.put("empleados", k, emps[k])); });
    Object.keys(novs).forEach(function (k) { ops.push(store.put("novedades", k, novs[k])); });
    Object.keys(liqs).forEach(function (k) { ops.push(store.put("liquidaciones", k, liqs[k])); });
    if (!DB) saveLocal();
    return Promise.all(ops);
  }
  function cargarDemo() {
    var d = DEMO.build(ENGINE, hoyISO().slice(0, 7));
    S.ui.confirm = null;
    reemplazarTodo(d.empresa, d.params, d.empleados, d.novedades, d.liqs, d.laudos).then(function () { S.periodo = hoyISO().slice(0, 7); toast("Empresa de ejemplo cargada"); go("panel"); });
  }
  function borrarTodo() { S.ui.confirm = null; reemplazarTodo(null, null, {}, {}, {}).then(function () { toast("Datos borrados"); go("panel"); }); }

  // ---------- IA ----------
  var CAMPOS_IA = CAMPOS_NOV.map(function (c) { return c[0] + " (" + c[1] + (c[2] ? ", solo " + c[2] : "") + ")"; }).join(", ");
  function novedadesIA() {
    var txt = ($("novTxt") && $("novTxt").value || "").trim();
    if (!txt) { toast("Escribí las novedades primero."); return; }
    var emps = activos();
    S.ui.novAI = { texto: txt, loading: true }; render();
    var prompt = ["Sos asistente de liquidación de sueldos de una empresa uruguaya. Pasá el texto de RR.HH. a cambios en la planilla de novedades de " + perLabel(S.periodo) + ".",
      "Empleados (id, nombre, forma de pago): " + JSON.stringify(emps.map(function (e) { return [e.id, e.nombre, e.tipo]; })),
      "Campos posibles: " + CAMPOS_IA + ". Los montos van en pesos uruguayos, sin puntos de miles. Las horas y días, como número.",
      "Novedades ya cargadas: " + JSON.stringify((S.novedades[S.periodo] || {}).items || {}),
      "Si el texto dice que algo se suma a lo que ya había (\"otras\", \"más\"), usá modo \"sumar\"; si no, \"reemplazar\". Un día de falta es faltas = 1. \"Se toma licencia\" o \"vacaciones\" es licencia en días. Certificado médico o \"está enfermo con certificado\" es certificacion; accidente laboral es accidente; seguro de paro o suspensión es paroDias; examen o parcial es licEstudio; nacimiento de un hijo (padre) es licPaternidad; casamiento es licMatrimonio; fallecimiento de un familiar es licDuelo; tickets o partida de comida en pesos es alimentacion. Si un nombre es ambiguo o algo no se puede cargar, ponelo en no_entendido.",
      "Texto: \"\"\"" + txt + "\"\"\"",
      'Respondé SOLO con JSON: {"cambios":[{"empleado_id":string,"campo":string,"valor":number,"modo":"reemplazar"|"sumar","explicacion":string (pocas palabras)}],"no_entendido":[string]}'].join("\n");
    AI.json(prompt).then(function (r) {
      var cur = (S.novedades[S.periodo] || {}).items || {}, ok = [];
      (r && r.cambios || []).forEach(function (c) {
        var e = S.empleados[c.empleado_id], campo = CAMPOS_NOV.filter(function (x) { return x[0] === c.campo; })[0];
        if (!e || !campo || (campo[2] && campo[2] !== e.tipo) || !isFinite(Number(c.valor))) return;
        var antes = (cur[e.id] || {})[c.campo], valor = Number(c.valor);
        if (c.modo === "sumar") valor = nz(antes) + valor;
        ok.push({ id: e.id, nombre: e.nombre, campo: c.campo, label: campo[1], antes: antes, valor: Math.max(0, Math.round(valor * 100) / 100), explicacion: c.explicacion });
      });
      S.ui.novAI = { texto: txt, cambios: ok, dudas: (r && r.no_entendido || []).map(String).slice(0, 6) }; render();
    }, function (e) { S.ui.novAI = { texto: txt, error: aiError(e) }; render(); });
  }
  function aplicarNovIA() {
    var ai = S.ui.novAI; if (!ai || !ai.cambios) return;
    var per = S.periodo, doc = S.novedades[per] ? JSON.parse(JSON.stringify(S.novedades[per])) : { periodo: per, items: {} };
    ai.cambios.forEach(function (c) { doc.items[c.id] = doc.items[c.id] || {}; doc.items[c.id][c.campo] = c.valor; });
    doc.actualizado = Date.now();
    store.put("novedades", per, doc).then(function () { toast(ai.cambios.length + (ai.cambios.length === 1 ? " novedad cargada" : " novedades cargadas")); S.ui.novAI = null; render(); });
  }
  function revisarIA() {
    var recs = calcMes(S.periodo), p = P(), prev = liqDe(perPrev(S.periodo), "mensual");
    S.ui.review = { periodo: S.periodo, loading: true }; S.keepScroll = true; render();
    var filas = recs.map(function (r) {
      var e = S.empleados[r.empleado.id] || r.empleado, pr = prev && prev.estado === "cerrada" ? prev.recibos.filter(function (x) { return x.empleado.id === e.id; })[0] : null;
      return { nombre: e.nombre, cargo: e.cargo, tipo: e.tipo, sueldo: e.tipo === "jornalero" ? e.jornal + " por día" : e.sueldo, novedades: r.novedades, nominal: r.totales.gravado, irpf: r.totales.irpf, liquido: r.totales.liquido, nominal_mes_anterior: pr ? pr.totales.gravado : null };
    });
    var prompt = ["Sos contador y revisás la liquidación de sueldos de " + perLabel(S.periodo) + " de una empresa uruguaya antes de emitir los recibos.",
      "Salario mínimo nacional: $" + p.smn + ". BPC: $" + p.bpc + ". Máximo legal: 8 horas extra por semana.",
      "Liquidación: " + JSON.stringify(filas),
      "Controles automáticos que ya se hicieron: " + JSON.stringify(revisar(S.periodo, recs).map(function (c) { return c.empleado + ": " + c.texto; })),
      "Buscá otras cosas raras que convenga revisar: novedades que no cuadran con el cargo, comisiones o horas extra muy altas, licencias largas, adelantos grandes, diferencias con el mes anterior sin una novedad que las explique. No repitas los controles automáticos. Si todo está bien, devolvé observaciones vacías. Español rioplatense, frases cortas.",
      'Respondé SOLO con JSON: {"resumen":string (1-2 frases),"observaciones":[{"nivel":"alta"|"media"|"baja","empleado":string,"texto":string,"sugerencia":string}]}'].join("\n");
    AI.json(prompt).then(function (r) {
      S.ui.review = { periodo: S.periodo, resumen: r && r.resumen ? String(r.resumen) : "", obs: (r && r.observaciones || []).slice(0, 8).map(function (o) { return { nivel: /alta|media|baja/.test(o.nivel) ? o.nivel : "baja", empleado: String(o.empleado || ""), texto: String(o.texto || ""), sugerencia: String(o.sugerencia || "") }; }) };
      S.keepScroll = true; render();
    }, function (e) { S.ui.review = { periodo: S.periodo, error: aiError(e) }; S.keepScroll = true; render(); });
  }
  function explicarIA(key) {
    var x = recPorKey(key); if (!x) return;
    S.ui.explain[key] = { loading: true }; S.ui.rec = key; render();
    var r = x.r, p = P();
    var prompt = ["Sos de RR.HH. en una empresa uruguaya. Explicá este recibo en lenguaje simple para el empleado, sin tecnicismos.",
      "Tipo: " + TIPO_REC[r.tipo] + ". Período: " + (r.fecha || r.periodo) + ". Empleado: " + r.empleado.nombre + " (" + (r.empleado.tipo === "jornalero" ? "jornalero" : "mensual") + ").",
      "Líneas (concepto, monto, detalle; negativos son descuentos): " + JSON.stringify(r.lineas.map(function (l) { return [l.concepto, l.monto, l.detalle]; })),
      (r.notas && r.notas.length ? "Notas del recibo: " + JSON.stringify(r.notas) : ""),
      "Totales: haberes $" + r.totales.haberes + ", descuentos $" + r.totales.descuentos + ", líquido $" + r.totales.liquido + ".",
      "Reglas que aplican: aporte jubilatorio 15% al BPS; FONASA (salud) 3% a 8% según ingreso y si tiene cónyuge o hijos a cargo; FRL 0,1%; IRPF solo si gana más de 7 BPC ($" + Math.round(7 * p.bpc) + "), con deducciones por aportes e hijos; el salario vacacional y la licencia no gozada no llevan aportes; la indemnización por despido no lleva aportes ni IRPF; los días con certificación médica, accidente o seguro de paro no los paga la empresa sino el BPS o el BSE; la alimentación no lleva aportes hasta un tope pero paga IRPF; el Fondo de Solidaridad se deduce del IRPF; la pensión alimenticia es una orden judicial; las retenciones (cuota sindical, préstamos) tienen un límite para que el trabajador cobre al menos el 35% del líquido; en diciembre el IRPF se ajusta con todo el año.",
      "Usá solo los números del recibo; no inventes otros. Español rioplatense, frases cortas.",
      'Respondé SOLO con JSON: {"resumen":string (1-2 frases: cuánto cobra y por qué),"puntos":[string] (3 a 6, uno por cada descuento o haber importante),"mensaje":string (mensaje corto y amable para mandarle al empleado por WhatsApp o mail)}'].join("\n");
    AI.json(prompt).then(function (o) {
      S.ui.explain[key] = { resumen: String(o && o.resumen || ""), puntos: (o && o.puntos || []).map(String).slice(0, 8), mensaje: String(o && o.mensaje || "") }; render();
    }, function (e) { S.ui.explain[key] = { error: aiError(e) }; render(); });
  }

  // ---------- inicio ----------
  setView();
  startStore();
  startAI();
})();
